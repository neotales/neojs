[package]
name = "neojs-module-policy"
description = "Engine-independent module format and path policy shared by neojs runtimes"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Deterministic shell-style test-file expansion shared by `neojs test` and
# `neojs-lite test`. Off by default so engine library crates do not pull `glob`.
test-glob = ["dep:glob"]
# Erasable TypeScript stripping shared by `neojs-core` (V8) and `neojs-lite-core`
# (QuickJS). Off by default so default `neojs-module-policy` has zero dependencies.
typescript = ["dep:deno_ast", "dep:url"]

[dependencies]
deno_ast = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
url = { workspace = true, optional = true }
