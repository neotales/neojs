[package]
name = "neojs-builtins"
description = "Engine-independent Neo built-in module implementations shared by the V8 and QuickJS runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[features]
default = []
# The shared `neo:chars` Rust implementation and descriptor. The V8 runtime
# enables it so a default V8 build keeps `chars`; the QuickJS runtime enables it
# explicitly. Cargo features are additive across the dependency graph, so a
# module is present whenever any dependent enables it.
chars = ["dep:unicode-general-category"]
# The shared `neo:strings` Rust implementation and descriptor. The V8 runtime
# enables it so a default V8 build keeps `strings`; the QuickJS runtime enables
# it explicitly. It uses the same Unicode General_Category crate for the
# JavaScript whitespace set that `String.prototype.trim` uses.
strings = ["dep:unicode-general-category"]

[dependencies]
# Unicode General_Category lookup for the `chars` classifier. Version 1.1.0
# ships the Unicode 16.0 tables and has no dependencies of its own.
unicode-general-category = { workspace = true, optional = true }

[dev-dependencies]
# Checks the pinned CaseFolding.txt artifact hash in the exhaustive table test.
sha2.workspace = true
