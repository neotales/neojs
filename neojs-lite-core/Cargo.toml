[package]
name = "neojs-lite-core"
description = "Small embeddable QuickJS runtime for NeoJS Lite, sharing module policy with neojs"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# A default Lite build keeps the shared `neo:assert`, `neo:chars`, `neo:crypto`,
# `neo:fs`, `neo:os`, `neo:ssh`, `neo:strings`, `neo:test`, and `neo:uuid`
# (`neo:uuid`, `neo:uuid/v4`, `neo:uuid/v7`) modules plus erasable TypeScript
# stripping (`typescript`). A consumer that wants the smallest QuickJS runtime
# can disable default features; the CLI below selects the features explicitly
# so a change to these defaults cannot silently change what the command
# advertises. Cargo features are additive and unify across the dependency graph:
# a feature is present whenever any dependent enables it. Selection is
# compile-time surface selection, not a sandbox.
default = ["neo-assert", "neo-chars", "neo-crypto", "neo-fs", "neo-os", "neo-ssh", "neo-strings", "neo-test", "neo-uuid", "typescript"]
# The shared `assert` module and its Promise observation host hooks. This
# enables the optional `neojs-builtins` dependency and its `assert` module.
neo-assert = ["dep:neojs-builtins", "neojs-builtins/assert"]
# The shared `chars` Rust logic, native registry object, native module
# declaration, and introspection list entry. This enables the optional
# `neojs-builtins` dependency and its `chars` module.
neo-chars = ["dep:neojs-builtins", "neojs-builtins/chars"]
# The shared `crypto` (`neo:crypto`) synchronous cryptographic exports, native
# registry object, native module declaration, and introspection list entry. This
# enables the optional `neojs-crypto-core` dependency; `--no-default-features`
# keeps it and all RustCrypto crates out.
neo-crypto = ["dep:neojs-crypto-core"]
# The shared `fs` (`neo:fs`) core filesystem operations, native registry object,
# native module declaration, and introspection list entry. This enables the
# optional `neojs-fs-core` dependency (and its fallible `getrandom` dependency);
# `--no-default-features` keeps all of them out.
neo-fs = ["dep:neojs-fs-core"]
# The shared `os` Rust constants (`platform`, `arch`), native registry object,
# native module declaration, and introspection list entry.
neo-os = ["dep:neojs-builtins", "neojs-builtins/os"]
# The shared `ssh` (`neo:ssh`) synchronous SSH client, native registry object,
# native module declaration, and introspection list entry. This enables the
# optional `neojs-ssh-core` dependency (and `neotales-ssh`);
# `--no-default-features` keeps all of them out.
neo-ssh = ["dep:neojs-ssh-core"]
# The shared `strings` Rust logic, native registry object, native module
# declaration, and introspection list entry. This enables the optional
# `neojs-builtins` dependency and its `strings` module.
neo-strings = ["dep:neojs-builtins", "neojs-builtins/strings"]
# The shared `test` module, its host hooks, and `Runtime::run_tests`. This
# enables the optional `neojs-builtins` dependency and its `test` module.
neo-test = ["dep:neojs-builtins", "neojs-builtins/test"]
# The shared `uuid` (`neo:uuid`, `neo:uuid/v4`, `neo:uuid/v7`) Rust logic,
# native registry objects, native module declarations, and introspection list
# entries. This enables `neojs-builtins/uuid` (and its fallible `getrandom` +
# `uuid::Builder` dependencies); `--no-default-features` keeps all of them out.
neo-uuid = ["dep:neojs-builtins", "neojs-builtins/uuid"]
# `neo.jsonc` `ImportResolver` integration for local `imports` and workspace
# packages. Opt-in so `--no-default-features` stays free of manifest/glob deps.
manifest = ["dep:neojs-manifest"]
# Erasable TypeScript (`.ts` and `.mts`) stripping shared with `neojs-core`
# through `neojs-module-policy/typescript` (`deno_ast`). `--no-default-features`
# keeps `deno_ast` and its parser dependencies out of minimal builds.
typescript = ["neojs-module-policy/typescript"]
# Test-only streaming-read counters for the bounded text access tests. Never
# enabled by a normal build.
test-support = []

[dependencies]
# The shared `neo:chars` Rust logic is enabled by the `neo-chars` feature.
neojs-builtins = { workspace = true, optional = true }
neojs-crypto-core = { workspace = true, optional = true }
neojs-fs-core = { workspace = true, optional = true }
neojs-manifest = { workspace = true, optional = true }
neojs-module-policy = { version = "0.0.0-alpha.0", path = "../neojs-module-policy" }
neojs-ssh-core = { workspace = true, optional = true }
# Pinned: the C API and Rust API change between minor releases. 0.14.0 is the
# version reviewed for this crate; `loader` supplies the module resolver and
# loader traits, and `std` supplies filesystem resolution helpers.
rquickjs = { version = "=0.14.0", default-features = false, features = ["loader", "std"] }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
neojs-dts.workspace = true
neotales-ssh.workspace = true
tempfile.workspace = true
