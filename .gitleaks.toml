title = "vaeljs gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Published X25519 age test vector and invalid-key fixture in age tests"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-core/src/age\.rs$''',
  '''^(?:vaeljs|neojs)-core/tests/age\.rs$''',
  '''^(?:vaeljs|neojs)/tests/cli\.rs$''',
]
regexes = [
  '''AGE-SECRET-KEY-1GQ9778VQXMMJVE8SK7J6VT8UJ4HDQAJUVSFCWCM02D8GEWQ72PVQ2Y5J33''',
  '''AGE-SECRET-KEY-1A{64}''',
]

[[allowlists]]
description = "Encrypted OpenSSH test fixture in vaeljs-lite-core SSH tests"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-lite-core/tests/ssh\.rs$''',
]
regexTarget = "match"
regexes = [
  '''b3BlbnNzaC1rZXktdjEAAAAACmFlczI1Ni1jdHI''',
]

[[allowlists]]
description = "Dynamic PKCS#8 PEM test helper template in SSH integration tests"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-lite-core/tests/ssh\.rs$''',
  '''^(?:vaeljs|neojs)-core/tests/ssh\.rs$''',
  '''^(?:vaeljs|neojs)-ssh-core/tests/ssh\.rs$''',
]
regexTarget = "match"
regexes = [
  '''-----BEGIN PRIVATE KEY-----\\n\{encoded\}\\n-----END PRIVATE KEY-----''',
]

[[allowlists]]
description = "Dummy 4-byte PEM unit-test fixture and PEM header constants in SSH client"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-ssh-core/src/client\.rs$''',
  '''^neojs-core/src/ssh\.rs$''',
]
regexTarget = "match"
regexes = [
  '''-----BEGIN PRIVATE KEY-----\\nAAEC\\nAw==\\n-----END PRIVATE KEY-----''',
  '''const PKCS8_PEM''',
  '''PEM block''',
]

[[allowlists]]
description = "Invalid all-A age key negative test in age.rs (matched against line because age-secret-key captures 58 Bech32 chars)"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-core/src/age\.rs$''',
]
regexTarget = "line"
regexes = [
  '''AGE-SECRET-KEY-1A{64}''',
]

[[allowlists]]
description = "NIST SP 800-38D AES-256-GCM Case 15 public test vector in crypto envelope tests"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-(?:core/src/crypto|crypto-core/src/(?:envelope|lib))\.rs$''',
]
regexes = [
  '''feffe9928665731c6d6a8f9467308308feffe9928665731c6d6a8f9467308308''',
]

[[allowlists]]
description = "Synthetic SSH redaction canary in ssh-core integration tests"
condition = "AND"
paths = [
  '''^(?:vaeljs|neojs)-ssh-core/tests/ssh\.rs$''',
]
regexes = [
  '''UNIQUE-PASSPHRASE-2b8d41''',
]

[[allowlists]]
description = "Synthetic .npmrc auth token test fixture in npm_loader tests"
condition = "AND"
paths = [
  '''^vaeljs-core/tests/npm_loader\.rs$''',
]
regexes = [
  '''vael_priv_tok_42''',
]

[[allowlists]]
description = "Deterministic build-measurement JSON key and context_key fields in measurements.jsonl"
condition = "AND"
paths = [
  '''^eng/size/measurements\.jsonl$''',
]
regexTarget = "match"
regexes = [
  '''"?(?:context_)?key":"[A-Za-z0-9._-]+"''',
]

[[allowlists]]
description = "Historical V8 source build header SHA-256 checksum in build-bounded.sh"
condition = "AND"
paths = [
  '''^eng/v8-source/build-bounded\.sh$''',
]
regexTarget = "match"
regexes = [
  '''KEYS_H_SHA=[0-9a-f]{64}''',
]
