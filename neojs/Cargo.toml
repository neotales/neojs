[package]
name = "neojs"
description = "Command-line ECMAScript and erasable TypeScript runtime built on neojs-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["neo-db", "neo-template", "node-compat", "npm"]
# Enables `neo:db` in `neojs-core`. Opt-outable with `--no-default-features`.
neo-db = ["neojs-core/neo-db"]
# Enables `neo:template` in `neojs-core`. Opt-outable with `--no-default-features`.
neo-template = ["neojs-core/neo-template"]
# Enables `node:*` compatibility modules in `neojs-core`. Opt-outable with `--no-default-features`.
node-compat = ["neojs-core/node-compat"]
# Opt-outable `npm:` and `package.json` CAS-backed module resolution.
npm = ["neojs-core/npm"]

[dependencies]
neojs-core = { version = "0.0.0-alpha.0", path = "../neojs-core", default-features = false, features = ["neo-chars", "neo-slices", "neo-strings"] }
neojs-dts.workspace = true
neojs-manifest.workspace = true
# Deterministic shell-style expansion for `neojs test`.
neojs-module-policy = { version = "0.0.0-alpha.0", path = "../neojs-module-policy", features = ["test-glob"] }

[dev-dependencies]
base64.workspace = true
flate2.workspace = true
# The duplicate dependency enables the test-only fault injection for this
# package's tests. A normal `cargo build -p neojs` does not include dev-deps.
neojs-core = { version = "0.0.0-alpha.0", path = "../neojs-core", default-features = false, features = ["test-support"] }
neojs-npm.workspace = true
neotales-ssh.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
