# Continuous integration for neojs.
#
# All GitHub Actions are pinned to immutable 40-char commit SHAs (Node 24).

name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

# Cancel superseded pull_request runs; never cancel pushes to dev or main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must stay aligned with `workspace.package.rust-version` in Cargo.toml and
  # `eng/size/toolchain`.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  fmt-and-lint:
    name: Format and Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify toolchain pin matches eng/size/toolchain
        run: |
          set -euo pipefail
          size_toolchain=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            eng/size/toolchain | sed '/^$/d' | head -n 1)
          if [ "${size_toolchain}" != "${RUST_TOOLCHAIN}" ]; then
            echo "ERROR: eng/size/toolchain (${size_toolchain}) != RUST_TOOLCHAIN (${RUST_TOOLCHAIN})" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy default workspace (V8 + shared crates)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy neojs-core standalone
        run: cargo clippy --locked -p neojs-core --all-targets -- -D warnings

      - name: Clippy neojs-builtins (all features)
        run: cargo clippy --locked -p neojs-builtins --all-features --all-targets -- -D warnings

      - name: Clippy neojs-module-policy (all features)
        run: cargo clippy --locked -p neojs-module-policy --all-features --all-targets -- -D warnings

      - name: Clippy neojs-crypto-core (all features)
        run: cargo clippy --locked -p neojs-crypto-core --all-features --all-targets -- -D warnings

      - name: Clippy neojs-remote (no default features)
        run: cargo clippy --locked -p neojs-remote --no-default-features --all-targets -- -D warnings

      - name: Clippy neojs-npm (all features)
        run: cargo clippy --locked -p neojs-npm --all-features --all-targets -- -D warnings

      - name: Clippy neojs-lite (default features)
        run: cargo clippy --locked -p neojs-lite-core -p neojs-lite --all-targets -- -D warnings

      - name: Clippy neojs-lite (CLI --no-default-features)
        run: cargo clippy --locked -p neojs-lite-core -p neojs-lite --no-default-features --all-targets -- -D warnings

      - name: Clippy neojs-lite-core (--no-default-features)
        run: cargo clippy --locked -p neojs-lite-core --no-default-features --all-targets -- -D warnings

      - name: Verify rustdoc builds cleanly (-D warnings)
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps \
            -p neojs-crypto-core \
            -p neojs-dbapi \
            -p neojs-dts \
            -p neojs-fs-core \
            -p neojs-manifest \
            -p neojs-module-policy \
            -p neojs-npm \
            -p neojs-ssh-core \
            -p neojs-lite-core \
            -p neojs-lite
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps \
            -p neojs-remote --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps \
            -p neojs-module-policy --all-features

      - name: Lint size-tracking shell scripts
        run: shellcheck -x -P eng/size eng/size/*.sh

  test-v8:
    name: Test V8 Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run V8 workspace tests
        run: cargo test --locked

      - name: Run shared JS/TS tests on neojs
        run: |
          set -euo pipefail
          shopt -s nullglob
          shared_tests=(tests/js/shared/*.test.js tests/js/shared/*.test.ts)
          if [ "${#shared_tests[@]}" -eq 0 ]; then
            echo "ERROR: no shared JS/TS tests found under tests/js/shared/*.test.{js,ts}" >&2
            exit 1
          fi
          cargo run --locked -p neojs -- test "${shared_tests[@]}"

  test-lite:
    name: Test Lite Runtime and Shared Crates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test neojs-builtins (all features)
        run: cargo test --locked -p neojs-builtins --all-features

      - name: Test neojs-builtins (no default features)
        run: cargo test --locked -p neojs-builtins --no-default-features

      - name: Test neojs-crypto-core (all features)
        run: cargo test --locked -p neojs-crypto-core --all-features

      - name: Test neojs-remote (no default features)
        run: cargo test --locked -p neojs-remote --no-default-features

      - name: Test neojs-npm (all features)
        run: cargo test --locked -p neojs-npm --all-features

      - name: Test neojs-module-policy (no default features and all features)
        run: |
          set -euo pipefail
          cargo test --locked -p neojs-module-policy --no-default-features
          cargo test --locked -p neojs-module-policy --all-features

      - name: Test neojs-lite-core and neojs-lite (default features)
        run: cargo test --locked -p neojs-lite-core -p neojs-lite

      - name: Test neojs-lite-core and neojs-lite (CLI --no-default-features)
        run: cargo test --locked -p neojs-lite-core -p neojs-lite --no-default-features

      - name: Test neojs-lite-core (--no-default-features)
        run: cargo test --locked -p neojs-lite-core --no-default-features

      - name: Run shared JS/TS tests on neojs-lite
        run: |
          set -euo pipefail
          shopt -s nullglob
          shared_tests=(tests/js/shared/*.test.js tests/js/shared/*.test.ts)
          if [ "${#shared_tests[@]}" -eq 0 ]; then
            echo "ERROR: no shared JS/TS tests found under tests/js/shared/*.test.{js,ts}" >&2
            exit 1
          fi
          cargo run --locked -p neojs-lite -- test "${shared_tests[@]}"

  engine-isolation:
    name: Engine Graph Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify V8 graph excludes QuickJS
        run: |
          set -euo pipefail
          v8_default_tree=$(cargo tree --locked --prefix none)
          if grep -Eq '^rquickjs(-core|-sys)? v' <<<"${v8_default_tree}"; then
            echo "ERROR: default workspace graph unexpectedly contains rquickjs" >&2
            grep -E '^rquickjs(-core|-sys)? v' <<<"${v8_default_tree}" >&2
            exit 1
          fi

          neojs_tree=$(cargo tree --locked -p neojs --prefix none)
          if grep -Eq '^rquickjs(-core|-sys)? v' <<<"${neojs_tree}"; then
            echo "ERROR: neojs graph unexpectedly contains rquickjs" >&2
            grep -E '^rquickjs(-core|-sys)? v' <<<"${neojs_tree}" >&2
            exit 1
          fi

      - name: Verify QuickJS graph excludes V8 and deno_core
        run: |
          set -euo pipefail
          lite_tree=$(cargo tree --locked -p neojs-lite --prefix none)
          if grep -Eq '^(deno_core|deno_v8|v8) v' <<<"${lite_tree}"; then
            echo "ERROR: neojs-lite graph unexpectedly contains V8 or deno_core" >&2
            grep -E '^(deno_core|deno_v8|v8) v' <<<"${lite_tree}" >&2
            exit 1
          fi

      - name: Verify zero normal dependencies in neojs-dts and neojs-module-policy
        run: |
          set -euo pipefail
          dts_tree=$(cargo tree --locked -e normal -p neojs-dts --prefix none)
          if [ "$(grep -c . <<<"${dts_tree}")" -ne 1 ]; then
            echo "ERROR: neojs-dts must have 0 normal dependencies" >&2
            echo "${dts_tree}" >&2
            exit 1
          fi

          policy_tree=$(cargo tree --locked -e normal -p neojs-module-policy --no-default-features --prefix none)
          if [ "$(grep -c . <<<"${policy_tree}")" -ne 1 ]; then
            echo "ERROR: neojs-module-policy --no-default-features must have 0 normal dependencies" >&2
            echo "${policy_tree}" >&2
            exit 1
          fi

      - name: Verify neojs-ssh-core and neojs-crypto-core exclude engines and tokio
        run: |
          set -euo pipefail
          for pkg in neojs-ssh-core neojs-crypto-core; do
            tree=$(cargo tree --locked -e normal -p "${pkg}" --prefix none)
            if grep -Eq '^(deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys|tokio) v' <<<"${tree}"; then
              echo "ERROR: ${pkg} normal graph unexpectedly contains a JS engine or tokio" >&2
              grep -E '^(deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys|tokio) v' <<<"${tree}" >&2
              exit 1
            fi
          done

      - name: Verify offline neojs-remote and neojs-npm exclude ureq and engines
        run: |
          set -euo pipefail
          remote_offline_tree=$(cargo tree --locked -e normal -p neojs-remote --no-default-features --prefix none)
          if grep -Eq '^(ureq|deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys) v' <<<"${remote_offline_tree}"; then
            echo "ERROR: neojs-remote --no-default-features normal graph unexpectedly contains ureq or a JS engine" >&2
            grep -E '^(ureq|deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys) v' <<<"${remote_offline_tree}" >&2
            exit 1
          fi

          npm_default_tree=$(cargo tree --locked -e normal -p neojs-npm --prefix none)
          if grep -Eq '^(ureq|deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys) v' <<<"${npm_default_tree}"; then
            echo "ERROR: neojs-npm normal graph unexpectedly contains ureq or a JS engine" >&2
            grep -E '^(ureq|deno_core|deno_v8|v8|rquickjs|rquickjs-core|rquickjs-sys) v' <<<"${npm_default_tree}" >&2
            exit 1
          fi

      - name: Verify minimal neojs-lite-core excludes optional runtime crates
        run: |
          set -euo pipefail
          lite_core_minimal_tree=$(cargo tree --locked -e normal -p neojs-lite-core --no-default-features --prefix none)
          forbidden='^(deno_ast|deno_core|deno_v8|v8|neojs-builtins|neojs-fs-core|neojs-ssh-core|neojs-crypto-core|neojs-manifest|neojs-dts) v'
          if grep -Eq "${forbidden}" <<<"${lite_core_minimal_tree}"; then
            echo "ERROR: neojs-lite-core --no-default-features normal graph unexpectedly contains excluded crates" >&2
            grep -E "${forbidden}" <<<"${lite_core_minimal_tree}" >&2
            exit 1
          fi

  size-gate:
    name: Size Tracker Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Populate Cargo cache for offline size-tracker tests
        run: cargo fetch --locked

      - name: Run size-tracker test and ledger validation
        run: bash eng/size/check.sh
