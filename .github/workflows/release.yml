# Tag-only 6-target release build, packaging, smoke verification, SBOM/provenance
# generation, and immutable GitHub Release publishing for vaeljs.
#
# Security & release boundary:
# - Workflow-level permissions are `contents: read`, so `verify-tag`,
#   `security-gates`, and all 6 `build` matrix jobs remain strictly read-only.
# - Tag builds run without `Swatinem/rust-cache` (cold build cache isolation)
#   so shipped release binaries compile cleanly from `Cargo.lock` + `vendor/`.
# - Only `publish-release` grants `contents: write`, `id-token: write`, and
#   `attestations: write` to generate CycloneDX/SPDX SBOMs, `SHA256SUMS.txt`,
#   SLSA build provenance / SBOM attestations, and create an immutable GitHub
#   Release (failing closed if a release already exists for the tag).
# - OS code-signing and any future crates.io publishing remain outside this
#   workflow (`publish = false` on all crates).
# - All GitHub Actions are pinned to immutable 40-char commit SHAs (Node 24 / composite).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Must stay aligned with `workspace.package.rust-version` in Cargo.toml and
  # `eng/size/toolchain`.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  verify-tag:
    name: Verify Tag, Metadata, and Types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is annotated and well-formed
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            echo "ERROR: tag '${tag}' must start with 'v'" >&2
            exit 1
          fi
          # actions/checkout fetches +${GITHUB_SHA}:refs/tags/${tag} (a lightweight
          # ref to the commit SHA) on tag pushes, so re-fetch the real tag object.
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
          obj_type=$(git cat-file -t "refs/tags/${tag}")
          if [ "${obj_type}" != "tag" ]; then
            echo "ERROR: tag '${tag}' is a '${obj_type}' (lightweight tag); release builds require an annotated tag." >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: tag '${tag}' resolves to commit '${tag_commit}', expected checked-out commit '${GITHUB_SHA}'." >&2
            exit 1
          fi

      - name: Verify toolchain pin matches eng/size/toolchain
        run: |
          set -euo pipefail
          size_toolchain=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            eng/size/toolchain | sed '/^$/d' | head -n 1)
          if [ "${size_toolchain}" != "${RUST_TOOLCHAIN}" ]; then
            echo "ERROR: eng/size/toolchain (${size_toolchain}) != RUST_TOOLCHAIN (${RUST_TOOLCHAIN})" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Verify all workspace versions and publish = false guard
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          metadata=$(cargo metadata --no-deps --locked --format-version 1)

          pkg_count=$(jq '.packages | length' <<<"${metadata}")
          if [ "${pkg_count}" -eq 0 ]; then
            echo "ERROR: cargo metadata returned zero workspace packages" >&2
            exit 1
          fi

          mapfile -t bad_versions < <(
            jq -r --arg ver "${tag_version}" \
              '.packages[] | select(.version != $ver) | "\(.name)=\(.version)"' <<<"${metadata}"
          )
          if [ "${#bad_versions[@]}" -gt 0 ]; then
            echo "ERROR: workspace package version mismatch (expected ${tag_version}): ${bad_versions[*]}" >&2
            exit 1
          fi

          mapfile -t publishable < <(
            jq -r '.packages[] | select(.publish != []) | "\(.name)=\(.publish)"' <<<"${metadata}"
          )
          if [ "${#publishable[@]}" -gt 0 ]; then
            echo "ERROR: workspace packages must set publish = false (publish == []): ${publishable[*]}" >&2
            exit 1
          fi

      - name: Generate canonical V8 and Lite TypeScript declarations
        run: |
          set -euo pipefail
          rm -rf dist-types
          mkdir -p dist-types/v8 dist-types/lite
          cargo run --locked -p vaeljs-lite --bin vjs-lite -- types --profile v8 --out-dir dist-types/v8
          cargo run --locked -p vaeljs-lite --bin vjs-lite -- types --profile lite --out-dir dist-types/lite
          test -f dist-types/v8/index.d.ts
          test -f dist-types/lite/index.d.ts

      - name: Upload canonical TypeScript declarations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-types
          path: dist-types/
          retention-days: 7
          if-no-files-found: error

  security-gates:
    name: Pre-Release Security Gates
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install pinned security scanners
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit@0.23.0,cargo-deny@0.22.1

      - name: Run RustSec advisory audit
        run: cargo audit --deny warnings --deny yanked

      - name: Run cargo-deny policy checks (V8 workspace + vaeljs-lite)
        run: |
          set -euo pipefail
          cargo deny --locked --workspace --all-features check advisories bans licenses sources
          cargo deny --locked --all-features --manifest-path vaeljs-lite/Cargo.toml check -A unmatched-skip -A unnecessary-skip advisories bans licenses sources

      - name: Download and verify pinned gitleaks binary
        run: |
          set -euo pipefail
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "${tmp_dir}"' EXIT
          archive="${tmp_dir}/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 "${url}" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${tmp_dir}" gitleaks
          install -m 0755 "${tmp_dir}/gitleaks" /usr/local/bin/gitleaks

      - name: Scan full repository history for secrets
        run: gitleaks git --no-banner --redact .

  build:
    name: Build & Smoke Test (${{ matrix.slug }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - slug: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - slug: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - slug: macos-amd64
            target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - slug: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
          - slug: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain and target
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${MATRIX_TARGET}"

      - name: Build release binaries
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          log_file=$(mktemp)
          trap 'rm -f "${log_file}"' EXIT

          set +e
          cargo build --release --locked --target "${MATRIX_TARGET}" -p vaeljs -p vaeljs-lite 2>&1 | tee "${log_file}"
          build_rc=${PIPESTATUS[0]}
          set -e

          if [ "${build_rc}" -ne 0 ]; then
            summary=$(
              sed -E $'s/\x1B\\[[0-9;]*[[:alpha:]]//g' "${log_file}" \
                | awk 'NF' \
                | tail -n 25 \
                | tr '\r\n' '  ' \
                | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' \
                | cut -c1-1000
            )
            echo "::error title=Build failed (${MATRIX_SLUG})::${summary:-cargo build exited ${build_rc}}"
            exit "${build_rc}"
          fi

      - name: Download canonical TypeScript declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-types
          path: dist-types

      - name: Stage and package Unix release archives
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          slug="${MATRIX_SLUG}"
          target="${MATRIX_TARGET}"
          source_epoch=$(git log -1 --format=%ct)

          rm -rf stage dist
          mkdir -p stage/vjs/types stage/vjs-lite/types dist

          pack_tar_gz() {
            local src_dir="$1"
            local out_file="$2"
            shift 2
            if tar --version 2>/dev/null | grep -q 'GNU tar'; then
              tar -C "${src_dir}" \
                --sort=name \
                --mtime="@${source_epoch}" \
                --numeric-owner \
                --owner=0 \
                --group=0 \
                -I 'gzip -n' \
                -cf "${out_file}" "$@"
            else
              COPYFILE_DISABLE=1 tar -C "${src_dir}" -czf "${out_file}" "$@"
            fi
          }

          install -m 0755 "target/${target}/release/vjs" "stage/vjs/vjs"
          install -m 0644 LICENSE.md "stage/vjs/LICENSE.md"
          cp -R dist-types/v8/. "stage/vjs/types/"
          pack_tar_gz stage/vjs "dist/vjs-${tag}-${slug}.tar.gz" vjs LICENSE.md types

          install -m 0755 "target/${target}/release/vjs-lite" "stage/vjs-lite/vjs-lite"
          install -m 0644 LICENSE.md "stage/vjs-lite/LICENSE.md"
          cp -R dist-types/lite/. "stage/vjs-lite/types/"
          pack_tar_gz stage/vjs-lite "dist/vjs-lite-${tag}-${slug}.tar.gz" vjs-lite LICENSE.md types

      - name: Stage and package Windows release archives
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $slug = $env:MATRIX_SLUG
          $target = $env:MATRIX_TARGET

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue stage, dist
          New-Item -ItemType Directory -Force -Path "stage/vjs", "stage/vjs-lite", "dist" | Out-Null

          Copy-Item "target/$target/release/vjs.exe" "stage/vjs/vjs.exe"
          Copy-Item "LICENSE.md" "stage/vjs/LICENSE.md"
          Copy-Item -Recurse "dist-types/v8" "stage/vjs/types"
          Compress-Archive -Path "stage/vjs/*" -DestinationPath "dist/vjs-$tag-$slug.zip" -Force

          Copy-Item "target/$target/release/vjs-lite.exe" "stage/vjs-lite/vjs-lite.exe"
          Copy-Item "LICENSE.md" "stage/vjs-lite/LICENSE.md"
          Copy-Item -Recurse "dist-types/lite" "stage/vjs-lite/types"
          Compress-Archive -Path "stage/vjs-lite/*" -DestinationPath "dist/vjs-lite-$tag-$slug.zip" -Force

      - name: Smoke test extracted Unix archives
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          slug="${MATRIX_SLUG}"

          smoke_dir=$(mktemp -d)
          trap 'rm -rf "${smoke_dir}"' EXIT
          mkdir -p "${smoke_dir}/vjs" "${smoke_dir}/vjs-lite"

          tar -xzf "dist/vjs-${tag}-${slug}.tar.gz" -C "${smoke_dir}/vjs"
          tar -xzf "dist/vjs-lite-${tag}-${slug}.tar.gz" -C "${smoke_dir}/vjs-lite"

          vjs_bin="${smoke_dir}/vjs/vjs"
          lite_bin="${smoke_dir}/vjs-lite/vjs-lite"

          for dir in "${smoke_dir}/vjs" "${smoke_dir}/vjs-lite"; do
            test -f "${dir}/LICENSE.md"
            test -f "${dir}/types/index.d.ts"
          done
          test -x "${vjs_bin}"
          test -x "${lite_bin}"

          shopt -s nullglob
          shared_tests=(tests/js/shared/*.test.js tests/js/shared/*.test.ts)
          if [ "${#shared_tests[@]}" -eq 0 ]; then
            echo "ERROR: no shared JS/TS tests found under tests/js/shared/*.test.{js,ts}" >&2
            exit 1
          fi

          exec_with_arch() {
            local arch_mode="$1"
            shift
            if [ -n "${arch_mode}" ]; then
              arch "${arch_mode}" "$@"
            else
              "$@"
            fi
          }

          run_smoke() {
            local bin="$1"
            local name="$2"
            local arch_mode="$3"

            local version_out
            version_out=$(exec_with_arch "${arch_mode}" "${bin}" --version)
            if [ "${version_out}" != "${name} ${tag_version}" ]; then
              echo "ERROR: ${name} --version returned '${version_out}', expected '${name} ${tag_version}'" >&2
              exit 1
            fi

            exec_with_arch "${arch_mode}" "${bin}" --help >/dev/null
            exec_with_arch "${arch_mode}" "${bin}" types --help >/dev/null

            set +e
            exec_with_arch "${arch_mode}" "${bin}" --unknown-flag >/dev/null 2>&1
            local unknown_rc=$?
            set -e
            if [ "${unknown_rc}" -ne 2 ]; then
              echo "ERROR: ${name} --unknown-flag exited ${unknown_rc}, expected 2" >&2
              exit 1
            fi

            exec_with_arch "${arch_mode}" "${bin}" test "${shared_tests[@]}"
          }

          if [ "${slug}" = "macos-amd64" ]; then
            file "${vjs_bin}" | grep -q 'Mach-O 64-bit executable x86_64'
            file "${lite_bin}" | grep -q 'Mach-O 64-bit executable x86_64'
            otool -L "${vjs_bin}"
            otool -L "${lite_bin}"
            if otool -L "${vjs_bin}" "${lite_bin}" | grep -Eq '(/opt/homebrew|/usr/local)'; then
              echo "ERROR: unexpected non-system library linkage detected in macos-amd64 binary" >&2
              exit 1
            fi
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              run_smoke "${vjs_bin}" "vjs" "-x86_64"
              run_smoke "${lite_bin}" "vjs-lite" "-x86_64"
            else
              echo "Rosetta 2 unavailable on runner; verified Mach-O x86_64 headers, otool -L, LICENSE.md, and types/index.d.ts."
            fi
          else
            run_smoke "${vjs_bin}" "vjs" ""
            run_smoke "${lite_bin}" "vjs-lite" ""
          fi

      - name: Smoke test extracted Windows archives
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $tagVersion = $tag.Substring(1)
          $slug = $env:MATRIX_SLUG

          $smokeDir = Join-Path ([System.IO.Path]::GetTempPath()) ("vaeljs-smoke-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path "$smokeDir/vjs", "$smokeDir/vjs-lite" | Out-Null

          try {
            Expand-Archive -Path "dist/vjs-$tag-$slug.zip" -DestinationPath "$smokeDir/vjs" -Force
            Expand-Archive -Path "dist/vjs-lite-$tag-$slug.zip" -DestinationPath "$smokeDir/vjs-lite" -Force

            $vjsBin = "$smokeDir/vjs/vjs.exe"
            $liteBin = "$smokeDir/vjs-lite/vjs-lite.exe"

            foreach ($dir in @("$smokeDir/vjs", "$smokeDir/vjs-lite")) {
              if (-not (Test-Path "$dir/LICENSE.md" -PathType Leaf)) {
                throw "Missing LICENSE.md in extracted archive: $dir"
              }
              if (-not (Test-Path "$dir/types/index.d.ts" -PathType Leaf)) {
                throw "Missing types/index.d.ts in extracted archive: $dir"
              }
            }
            if (-not (Test-Path $vjsBin -PathType Leaf)) { throw "Missing $vjsBin" }
            if (-not (Test-Path $liteBin -PathType Leaf)) { throw "Missing $liteBin" }

            $sharedTests = @(
              Get-ChildItem -Path "tests/js/shared" -File |
                Where-Object { $_.Name -like "*.test.js" -or $_.Name -like "*.test.ts" } |
                Sort-Object FullName |
                ForEach-Object { $_.FullName }
            )
            if ($sharedTests.Count -eq 0) {
              throw "No shared JS/TS tests found under tests/js/shared/*.test.{js,ts}"
            }

            foreach ($entry in @(
              @{ Bin = $vjsBin; Name = "vjs" },
              @{ Bin = $liteBin; Name = "vjs-lite" }
            )) {
              $ver = (& $entry.Bin --version | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $ver -ne "$($entry.Name) $tagVersion") {
                throw "$($entry.Name) --version returned '$ver' (exit $LASTEXITCODE), expected '$($entry.Name) $tagVersion'"
              }

              & $entry.Bin --help | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "$($entry.Name) --help exited $LASTEXITCODE"
              }

              & $entry.Bin types --help | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "$($entry.Name) types --help exited $LASTEXITCODE"
              }

              $proc = Start-Process -FilePath $entry.Bin -ArgumentList "--unknown-flag" -Wait -NoNewWindow -PassThru -RedirectStandardOutput "$smokeDir/unknown-out.txt" -RedirectStandardError "$smokeDir/unknown-err.txt"
              if ($proc.ExitCode -ne 2) {
                throw "$($entry.Name) --unknown-flag exited $($proc.ExitCode), expected 2"
              }

              $prevEap = $ErrorActionPreference
              $ErrorActionPreference = "Continue"
              try {
                $testOut = & $entry.Bin test @sharedTests 2>&1 | ForEach-Object { "$_" }
                $testRc = $LASTEXITCODE
              } finally {
                $ErrorActionPreference = $prevEap
              }
              $testOut | ForEach-Object { Write-Host $_ }
              if ($testRc -ne 0) {
                $tailLines = @($testOut | Where-Object { $_.Trim().Length -gt 0 } | Select-Object -Last 15)
                $summary = if ($tailLines.Count -gt 0) {
                  (($tailLines -join "`n") -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A")
                } else {
                  "exit $testRc (no output captured)"
                }
                Write-Host "::error title=Windows smoke failed ($slug / $($entry.Name))::$summary"
                throw "$($entry.Name) shared JS/TS tests failed (exit $testRc)"
              }
            }
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $smokeDir
          }

      - name: Upload target archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ matrix.slug }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Package SBOMs, Attest Provenance, and Publish Immutable Release
    needs: [build, security-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Install pinned cargo-cyclonedx
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-cyclonedx@0.5.10

      - name: Create SBOM staging directory
        run: mkdir -p sbom

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: sbom/vaeljs-${{ github.ref_name }}.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Generate CycloneDX JSON SBOMs (vjs and vjs-lite)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)

          mkdir -p sbom
          cargo cyclonedx --locked --manifest-path vaeljs/Cargo.toml --format json --describe crate --override-filename bom
          mv vaeljs/bom.cdx.json "sbom/vjs-${tag}.cdx.json"

          cargo cyclonedx --locked --manifest-path vaeljs-lite/Cargo.toml --format json --describe crate --override-filename bom
          mv vaeljs-lite/bom.cdx.json "sbom/vjs-lite-${tag}.cdx.json"

          for f in "sbom/vjs-${tag}.cdx.json" "sbom/vjs-lite-${tag}.cdx.json" "sbom/vaeljs-${tag}.spdx.json"; do
            test -s "${f}"
            jq empty "${f}"
          done

      - name: Download all target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-archives-*
          path: dist
          merge-multiple: true

      - name: Stage SBOMs and generate/verify SHA256SUMS.txt
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mv sbom/* dist/
          rmdir sbom

          cd dist
          shopt -s nullglob
          archives=(vjs-*.tar.gz vjs-*.zip)
          sboms=("vjs-${tag}.cdx.json" "vjs-lite-${tag}.cdx.json" "vaeljs-${tag}.spdx.json")
          if [ "${#archives[@]}" -ne 12 ]; then
            echo "ERROR: expected exactly 12 release archives in dist/, found ${#archives[@]}" >&2
            ls -la >&2
            exit 1
          fi
          for s in "${sboms[@]}"; do
            if [ ! -s "${s}" ]; then
              echo "ERROR: missing SBOM file '${s}' in dist/" >&2
              exit 1
            fi
          done
          mapfile -t sorted_files < <(printf '%s\n' "${archives[@]}" "${sboms[@]}" | LC_ALL=C sort)
          sha256sum "${sorted_files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Attest SLSA build provenance for archives, SBOMs, and SHA256SUMS.txt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vjs-*.tar.gz
            dist/vjs-*.zip
            dist/*.cdx.json
            dist/*.spdx.json
            dist/SHA256SUMS.txt

      - name: Attest SPDX SBOM for release archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/vjs-*.tar.gz
            dist/vjs-*.zip
          sbom-path: dist/vaeljs-${{ github.ref_name }}.spdx.json

      - name: Upload combined release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"

          if existing_json=$(gh release view "${tag}" --json isDraft 2>/dev/null); then
            is_existing_draft=$(jq -r '.isDraft' <<<"${existing_json}")
            if [ "${is_existing_draft}" = "false" ]; then
              echo "ERROR: non-draft GitHub Release already exists for immutable tag '${tag}'; refusing to overwrite or delete." >&2
              exit 1
            fi
            echo "ERROR: draft GitHub Release already exists for '${tag}'; resolve manually before publishing." >&2
            exit 1
          fi

          notes_file=$(mktemp)
          trap 'rm -f "${notes_file}"' EXIT

          if [ -f CHANGELOG.md ]; then
            awk -v ver="${tag_version}" '
              BEGIN {
                prefix = "## [" ver "]"
                in_section = 0
              }
              !in_section && index($0, prefix) == 1 {
                next_char = substr($0, length(prefix) + 1, 1)
                if (length($0) == length(prefix) || next_char ~ /[[:space:]-]/) {
                  in_section = 1
                  next
                }
              }
              in_section && (/^##[[:space:]]/ || /^\[[^]]+\]:[[:space:]]/) {
                exit
              }
              in_section {
                lines[++n] = $0
              }
              END {
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                end = n
                while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
                for (i = start; i <= end; i++) print lines[i]
              }
            ' CHANGELOG.md > "${notes_file}"
          fi

          if [ ! -s "${notes_file}" ]; then
            printf 'Release `%s`.\n\nSee `CHANGELOG.md` for release notes and `SHA256SUMS.txt` for archive/SBOM checksums.\n' "${tag}" > "${notes_file}"
          fi

          prerelease_args=()
          if [[ "${tag}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          shopt -s nullglob
          assets=(dist/vjs-*.tar.gz dist/vjs-*.zip dist/*.cdx.json dist/*.spdx.json dist/SHA256SUMS.txt)
          if [ "${#assets[@]}" -ne 16 ]; then
            echo "ERROR: expected 16 release assets (12 archives + 3 SBOMs + SHA256SUMS.txt), found ${#assets[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi

          gh release create "${tag}" "${assets[@]}" \
            --title "${tag}" \
            --notes-file "${notes_file}" \
            --verify-tag \
            "${prerelease_args[@]}"

          release_meta=$(gh release view "${tag}" --json isDraft,assets --jq '"\(.isDraft) \(.assets | length)"')
          read -r is_draft asset_count <<<"${release_meta}"
          if [ "${is_draft}" != "false" ] || [ "${asset_count}" -ne 16 ]; then
            echo "ERROR: expected published release (isDraft=false) with 16 attached assets on '${tag}', found isDraft=${is_draft}, assets=${asset_count}" >&2
            exit 1
          fi
