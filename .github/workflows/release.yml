# Tag-only 6-target release build, packaging, smoke verification, and GitHub Release publishing for neojs.
#
# Security & release boundary:
# - Workflow-level permissions are `contents: read`, so `verify-tag` and all 6
#   `build` matrix jobs remain strictly read-only.
# - Only `publish-release` grants `contents: write` to create/update the GitHub
#   Release with the 12 archives and `SHA256SUMS.txt` via `GITHUB_TOKEN` (no
#   external secrets).
# - Checksum signing/attestations, OS code-signing, and any future crates.io
#   publishing remain outside this workflow (`publish = false` on all crates).
# - All GitHub Actions are pinned to immutable 40-char commit SHAs (Node 24).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Must stay aligned with `workspace.package.rust-version` in Cargo.toml and
  # `eng/size/toolchain`.
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  verify-tag:
    name: Verify Tag, Metadata, and Types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is annotated and well-formed
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != v* ]]; then
            echo "ERROR: tag '${tag}' must start with 'v'" >&2
            exit 1
          fi
          # actions/checkout fetches +${GITHUB_SHA}:refs/tags/${tag} (a lightweight
          # ref to the commit SHA) on tag pushes, so re-fetch the real tag object.
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
          obj_type=$(git cat-file -t "refs/tags/${tag}")
          if [ "${obj_type}" != "tag" ]; then
            echo "ERROR: tag '${tag}' is a '${obj_type}' (lightweight tag); release builds require an annotated tag." >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: tag '${tag}' resolves to commit '${tag_commit}', expected checked-out commit '${GITHUB_SHA}'." >&2
            exit 1
          fi

      - name: Verify toolchain pin matches eng/size/toolchain
        run: |
          set -euo pipefail
          size_toolchain=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            eng/size/toolchain | sed '/^$/d' | head -n 1)
          if [ "${size_toolchain}" != "${RUST_TOOLCHAIN}" ]; then
            echo "ERROR: eng/size/toolchain (${size_toolchain}) != RUST_TOOLCHAIN (${RUST_TOOLCHAIN})" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify all workspace versions and publish = false guard
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          metadata=$(cargo metadata --no-deps --locked --format-version 1)

          pkg_count=$(jq '.packages | length' <<<"${metadata}")
          if [ "${pkg_count}" -eq 0 ]; then
            echo "ERROR: cargo metadata returned zero workspace packages" >&2
            exit 1
          fi

          mapfile -t bad_versions < <(
            jq -r --arg ver "${tag_version}" \
              '.packages[] | select(.version != $ver) | "\(.name)=\(.version)"' <<<"${metadata}"
          )
          if [ "${#bad_versions[@]}" -gt 0 ]; then
            echo "ERROR: workspace package version mismatch (expected ${tag_version}): ${bad_versions[*]}" >&2
            exit 1
          fi

          mapfile -t publishable < <(
            jq -r '.packages[] | select(.publish != []) | "\(.name)=\(.publish)"' <<<"${metadata}"
          )
          if [ "${#publishable[@]}" -gt 0 ]; then
            echo "ERROR: workspace packages must set publish = false (publish == []): ${publishable[*]}" >&2
            exit 1
          fi

      - name: Generate canonical V8 and Lite TypeScript declarations
        run: |
          set -euo pipefail
          rm -rf dist-types
          mkdir -p dist-types/v8 dist-types/lite
          cargo run --locked -p neojs-lite -- types --profile v8 --out-dir dist-types/v8
          cargo run --locked -p neojs-lite -- types --profile lite --out-dir dist-types/lite
          test -f dist-types/v8/index.d.ts
          test -f dist-types/lite/index.d.ts

      - name: Upload canonical TypeScript declarations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-types
          path: dist-types/
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build & Smoke Test (${{ matrix.slug }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
          - slug: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - slug: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - slug: macos-amd64
            target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
          - slug: windows-amd64
            target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
          - slug: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.slug }}

      - name: Build release binaries
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          log_file=$(mktemp)
          trap 'rm -f "${log_file}"' EXIT

          set +e
          cargo build --release --locked --target "${MATRIX_TARGET}" -p neojs -p neojs-lite 2>&1 | tee "${log_file}"
          build_rc=${PIPESTATUS[0]}
          set -e

          if [ "${build_rc}" -ne 0 ]; then
            summary=$(
              sed -E $'s/\x1B\\[[0-9;]*[[:alpha:]]//g' "${log_file}" \
                | awk 'NF' \
                | tail -n 25 \
                | tr '\r\n' '  ' \
                | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' \
                | cut -c1-1000
            )
            echo "::error title=Build failed (${MATRIX_SLUG})::${summary:-cargo build exited ${build_rc}}"
            exit "${build_rc}"
          fi

      - name: Download canonical TypeScript declarations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-types
          path: dist-types

      - name: Stage and package Unix release archives
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          slug="${MATRIX_SLUG}"
          target="${MATRIX_TARGET}"

          rm -rf stage dist
          mkdir -p stage/neojs/types stage/neojs-lite/types dist

          install -m 0755 "target/${target}/release/neojs" "stage/neojs/neojs"
          install -m 0644 LICENSE.md "stage/neojs/LICENSE.md"
          cp -R dist-types/v8/. "stage/neojs/types/"
          tar -C stage/neojs -czf "dist/neojs-${tag}-${slug}.tar.gz" neojs LICENSE.md types

          install -m 0755 "target/${target}/release/neojs-lite" "stage/neojs-lite/neojs-lite"
          install -m 0644 LICENSE.md "stage/neojs-lite/LICENSE.md"
          cp -R dist-types/lite/. "stage/neojs-lite/types/"
          tar -C stage/neojs-lite -czf "dist/neojs-lite-${tag}-${slug}.tar.gz" neojs-lite LICENSE.md types

      - name: Stage and package Windows release archives
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $slug = $env:MATRIX_SLUG
          $target = $env:MATRIX_TARGET

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue stage, dist
          New-Item -ItemType Directory -Force -Path "stage/neojs", "stage/neojs-lite", "dist" | Out-Null

          Copy-Item "target/$target/release/neojs.exe" "stage/neojs/neojs.exe"
          Copy-Item "LICENSE.md" "stage/neojs/LICENSE.md"
          Copy-Item -Recurse "dist-types/v8" "stage/neojs/types"
          Compress-Archive -Path "stage/neojs/*" -DestinationPath "dist/neojs-$tag-$slug.zip" -Force

          Copy-Item "target/$target/release/neojs-lite.exe" "stage/neojs-lite/neojs-lite.exe"
          Copy-Item "LICENSE.md" "stage/neojs-lite/LICENSE.md"
          Copy-Item -Recurse "dist-types/lite" "stage/neojs-lite/types"
          Compress-Archive -Path "stage/neojs-lite/*" -DestinationPath "dist/neojs-lite-$tag-$slug.zip" -Force

      - name: Smoke test extracted Unix archives
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          slug="${MATRIX_SLUG}"

          smoke_dir=$(mktemp -d)
          trap 'rm -rf "${smoke_dir}"' EXIT
          mkdir -p "${smoke_dir}/neojs" "${smoke_dir}/neojs-lite"

          tar -xzf "dist/neojs-${tag}-${slug}.tar.gz" -C "${smoke_dir}/neojs"
          tar -xzf "dist/neojs-lite-${tag}-${slug}.tar.gz" -C "${smoke_dir}/neojs-lite"

          neojs_bin="${smoke_dir}/neojs/neojs"
          lite_bin="${smoke_dir}/neojs-lite/neojs-lite"

          for dir in "${smoke_dir}/neojs" "${smoke_dir}/neojs-lite"; do
            test -f "${dir}/LICENSE.md"
            test -f "${dir}/types/index.d.ts"
          done
          test -x "${neojs_bin}"
          test -x "${lite_bin}"

          shopt -s nullglob
          shared_tests=(tests/js/shared/*.test.js tests/js/shared/*.test.ts)
          if [ "${#shared_tests[@]}" -eq 0 ]; then
            echo "ERROR: no shared JS/TS tests found under tests/js/shared/*.test.{js,ts}" >&2
            exit 1
          fi

          exec_with_arch() {
            local arch_mode="$1"
            shift
            if [ -n "${arch_mode}" ]; then
              arch "${arch_mode}" "$@"
            else
              "$@"
            fi
          }

          run_smoke() {
            local bin="$1"
            local name="$2"
            local arch_mode="$3"

            local version_out
            version_out=$(exec_with_arch "${arch_mode}" "${bin}" --version)
            if [ "${version_out}" != "${name} ${tag_version}" ]; then
              echo "ERROR: ${name} --version returned '${version_out}', expected '${name} ${tag_version}'" >&2
              exit 1
            fi

            exec_with_arch "${arch_mode}" "${bin}" --help >/dev/null
            exec_with_arch "${arch_mode}" "${bin}" types --help >/dev/null

            set +e
            exec_with_arch "${arch_mode}" "${bin}" --unknown-flag >/dev/null 2>&1
            local unknown_rc=$?
            set -e
            if [ "${unknown_rc}" -ne 2 ]; then
              echo "ERROR: ${name} --unknown-flag exited ${unknown_rc}, expected 2" >&2
              exit 1
            fi

            exec_with_arch "${arch_mode}" "${bin}" test "${shared_tests[@]}"
          }

          if [ "${slug}" = "macos-amd64" ]; then
            file "${neojs_bin}" | grep -q 'Mach-O 64-bit executable x86_64'
            file "${lite_bin}" | grep -q 'Mach-O 64-bit executable x86_64'
            otool -L "${neojs_bin}"
            otool -L "${lite_bin}"
            if otool -L "${neojs_bin}" "${lite_bin}" | grep -Eq '(/opt/homebrew|/usr/local)'; then
              echo "ERROR: unexpected non-system library linkage detected in macos-amd64 binary" >&2
              exit 1
            fi
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              run_smoke "${neojs_bin}" "neojs" "-x86_64"
              run_smoke "${lite_bin}" "neojs-lite" "-x86_64"
            else
              echo "Rosetta 2 unavailable on runner; verified Mach-O x86_64 headers, otool -L, LICENSE.md, and types/index.d.ts."
            fi
          else
            run_smoke "${neojs_bin}" "neojs" ""
            run_smoke "${lite_bin}" "neojs-lite" ""
          fi

      - name: Smoke test extracted Windows archives
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $tagVersion = $tag.Substring(1)
          $slug = $env:MATRIX_SLUG

          $smokeDir = Join-Path ([System.IO.Path]::GetTempPath()) ("neojs-smoke-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path "$smokeDir/neojs", "$smokeDir/neojs-lite" | Out-Null

          try {
            Expand-Archive -Path "dist/neojs-$tag-$slug.zip" -DestinationPath "$smokeDir/neojs" -Force
            Expand-Archive -Path "dist/neojs-lite-$tag-$slug.zip" -DestinationPath "$smokeDir/neojs-lite" -Force

            $neojsBin = "$smokeDir/neojs/neojs.exe"
            $liteBin = "$smokeDir/neojs-lite/neojs-lite.exe"

            foreach ($dir in @("$smokeDir/neojs", "$smokeDir/neojs-lite")) {
              if (-not (Test-Path "$dir/LICENSE.md" -PathType Leaf)) {
                throw "Missing LICENSE.md in extracted archive: $dir"
              }
              if (-not (Test-Path "$dir/types/index.d.ts" -PathType Leaf)) {
                throw "Missing types/index.d.ts in extracted archive: $dir"
              }
            }
            if (-not (Test-Path $neojsBin -PathType Leaf)) { throw "Missing $neojsBin" }
            if (-not (Test-Path $liteBin -PathType Leaf)) { throw "Missing $liteBin" }

            $sharedTests = @(
              Get-ChildItem -Path "tests/js/shared" -File |
                Where-Object { $_.Name -like "*.test.js" -or $_.Name -like "*.test.ts" } |
                Sort-Object FullName |
                ForEach-Object { $_.FullName }
            )
            if ($sharedTests.Count -eq 0) {
              throw "No shared JS/TS tests found under tests/js/shared/*.test.{js,ts}"
            }

            foreach ($entry in @(
              @{ Bin = $neojsBin; Name = "neojs" },
              @{ Bin = $liteBin; Name = "neojs-lite" }
            )) {
              $ver = (& $entry.Bin --version | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $ver -ne "$($entry.Name) $tagVersion") {
                throw "$($entry.Name) --version returned '$ver' (exit $LASTEXITCODE), expected '$($entry.Name) $tagVersion'"
              }

              & $entry.Bin --help | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "$($entry.Name) --help exited $LASTEXITCODE"
              }

              & $entry.Bin types --help | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "$($entry.Name) types --help exited $LASTEXITCODE"
              }

              $proc = Start-Process -FilePath $entry.Bin -ArgumentList "--unknown-flag" -Wait -NoNewWindow -PassThru -RedirectStandardOutput "$smokeDir/unknown-out.txt" -RedirectStandardError "$smokeDir/unknown-err.txt"
              if ($proc.ExitCode -ne 2) {
                throw "$($entry.Name) --unknown-flag exited $($proc.ExitCode), expected 2"
              }

              & $entry.Bin test @sharedTests
              if ($LASTEXITCODE -ne 0) {
                throw "$($entry.Name) shared JS/TS tests failed (exit $LASTEXITCODE)"
              }
            }
          } finally {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $smokeDir
          }

      - name: Upload target archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ matrix.slug }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  publish-release:
    name: Package Checksums and Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all target archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-archives-*
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(neojs-*.tar.gz neojs-*.zip)
          if [ "${#archives[@]}" -ne 12 ]; then
            echo "ERROR: expected exactly 12 release archives in dist/, found ${#archives[@]}" >&2
            ls -la >&2
            exit 1
          fi
          mapfile -t sorted_archives < <(printf '%s\n' "${archives[@]}" | LC_ALL=C sort)
          sha256sum "${sorted_archives[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"

          notes_file=$(mktemp)
          trap 'rm -f "${notes_file}"' EXIT

          if [ -f CHANGELOG.md ]; then
            awk -v ver="${tag_version}" '
              BEGIN {
                prefix = "## [" ver "]"
                in_section = 0
              }
              !in_section && index($0, prefix) == 1 {
                next_char = substr($0, length(prefix) + 1, 1)
                if (length($0) == length(prefix) || next_char ~ /[[:space:]-]/) {
                  in_section = 1
                  next
                }
              }
              in_section && (/^##[[:space:]]/ || /^\[[^]]+\]:[[:space:]]/) {
                exit
              }
              in_section {
                lines[++n] = $0
              }
              END {
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                end = n
                while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
                for (i = start; i <= end; i++) print lines[i]
              }
            ' CHANGELOG.md > "${notes_file}"
          fi

          if [ ! -s "${notes_file}" ]; then
            printf 'Release `%s`.\n\nSee `CHANGELOG.md` for release notes and `SHA256SUMS.txt` for archive checksums.\n' "${tag}" > "${notes_file}"
          fi

          prerelease_args=()
          if [[ "${tag}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          shopt -s nullglob
          assets=(dist/neojs-*.tar.gz dist/neojs-*.zip dist/SHA256SUMS.txt)
          if [ "${#assets[@]}" -ne 13 ]; then
            echo "ERROR: expected 13 release assets (12 archives + SHA256SUMS.txt), found ${#assets[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
            gh release edit "${tag}" --title "${tag}" --notes-file "${notes_file}" ${prerelease_args[@]+"${prerelease_args[@]}"}
          else
            gh release create "${tag}" "${assets[@]}" --title "${tag}" --notes-file "${notes_file}" --verify-tag ${prerelease_args[@]+"${prerelease_args[@]}"}
          fi

          asset_count=$(gh release view "${tag}" --json assets --jq '.assets | length')
          if [ "${asset_count}" -ne 13 ]; then
            echo "ERROR: expected 13 attached assets on release '${tag}', found ${asset_count}" >&2
            exit 1
          fi
