[package]
name = "neojs-dbapi"
description = "Driver-neutral SQL API with strict JSON configuration and portable named or positional parameters"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["sql", "sqlite", "database", "bindings"]
categories = ["database"]

[features]
# The default build links the SQLite provider and nothing else. No Node,
# JavaScript, or V8 dependency exists in this crate, so the default graph stays
# a plain Rust database library.
default = ["sqlite"]
sqlite = ["dep:neotales-dbapi-sqlite"]

[dependencies]
neotales-dbapi.workspace = true
serde_json.workspace = true
neotales-dbapi-sqlite = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
