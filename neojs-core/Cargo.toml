[package]
name = "neojs-core"
description = "Embeddable ECMAScript module runtime built on Deno's V8 bindings, with erasable TypeScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# A default build keeps the existing V8 runtime surface. Every public Neo module
# that gains an independent implementation gets its own `neo-*` feature, and the
# default enables each one. Node modules are intentionally absent: there is no
# `node:*` feature, so Node built-ins remain rejected by default.
default = ["neo-strings"]
# The `neo:strings` built-in and its `strings`/`neo:strings` import specifiers.
# This is engine-local selection, not a security boundary: disabling it removes
# the public module, its implementation, adapter, and registration from the
# build, but executable code keeps the process's authority. Cargo features are
# additive and unify across the dependency graph, so a build that another
# dependent enables a module for contains that module. Select modules through
# features; never treat a disabled module as a sandbox.
neo-strings = []
# Test-only fault injection for the peer-close reply branch. Never enabled by a
# normal build; `neojs` enables it only for its own dev/test targets.
test-support = []

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
bcrypt.workspace = true
cbc.workspace = true
deno_ast.workspace = true
deno_core.workspace = true
deno_error.workspace = true
getrandom.workspace = true
hmac.workspace = true
httpdate.workspace = true
neojs-module-policy = { version = "0.1.0", path = "../neojs-module-policy" }
neotales-age.workspace = true
neotales-ssh.workspace = true
pbkdf2.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
ureq.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
