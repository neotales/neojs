[package]
name = "neojs-core"
description = "Embeddable ECMAScript module runtime built on Deno's V8 bindings, with erasable TypeScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = []
# Opt-in Node compatibility. It adds `node:child_process` to the loader only
# when a runtime is created with `Runtime::with_node_compat`; the default V8
# graph does not compile the Node adapter or its shared crate.
node-compat = ["dep:neojs-node"]
# Test-only fault injection for the peer-close reply branch. Never enabled by a
# normal build; `neojs` enables it only for its own dev/test targets.
test-support = []

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
bcrypt.workspace = true
cbc.workspace = true
deno_ast.workspace = true
deno_core.workspace = true
deno_error.workspace = true
getrandom.workspace = true
hmac.workspace = true
httpdate.workspace = true
neojs-module-policy = { version = "0.1.0", path = "../neojs-module-policy" }
neojs-node = { version = "0.1.0", path = "../neojs-node", optional = true }
neotales-age.workspace = true
neotales-ssh.workspace = true
pbkdf2.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
ureq.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
