[package]
name = "neojs-core"
description = "Embeddable ECMAScript module runtime built on Deno's V8 bindings, with erasable TypeScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# A default V8 build keeps the existing surface: the native `neo:chars` and
# `neo:strings` bindings and `neo:slices`, which depends on `chars`.
# `neo-slices` implies `neo-chars` because `CharSlice` captures
# `chars.toUpper`/`chars.toLower`. With default features off, every public
# module, the native registration, the registry entries, and the loader entries
# are absent. The `slices` implementation is a separate file included only
# under `neo-slices`, so it is not embedded in a disabled binary. Features are
# additive and unify across the dependency graph; this is surface selection,
# not a sandbox.
default = ["neo-chars", "neo-slices", "neo-strings"]
# The native `chars` binding and its canonical V8 registration. This enables
# the optional `neojs-builtins` dependency and its `chars` module.
neo-chars = ["dep:neojs-builtins", "neojs-builtins/chars"]
# `slices` and its loader/registry entries. It cannot be built without `chars`:
# `CharSlice` captures `chars.toUpper` and `chars.toLower`.
neo-slices = ["neo-chars"]
# The native `strings` binding and its canonical V8 registration. This enables
# the optional `neojs-builtins` dependency and its `strings` module.
neo-strings = ["dep:neojs-builtins", "neojs-builtins/strings"]
# Test-only fault injection for the peer-close reply branch. Never enabled by a
# normal build; `neojs` enables it only for its own dev/test targets.
test-support = ["neojs-remote/test-support"]

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
bcrypt.workspace = true
cbc.workspace = true
deno_ast.workspace = true
deno_core.workspace = true
deno_error.workspace = true
getrandom.workspace = true
hmac.workspace = true
neojs-builtins = { workspace = true, optional = true }
neojs-module-policy = { version = "0.1.0", path = "../neojs-module-policy" }
neojs-remote.workspace = true
neotales-age.workspace = true
neotales-ssh.workspace = true
pbkdf2.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Enables the vendored deno_core test-only seam for the lazy-ESM collision
# test. Normal builds do not enable this feature.
deno_core = { workspace = true, features = ["native_module_testing"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
