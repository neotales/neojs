[package]
name = "vaeljs-remote"
description = "Engine-independent HTTPS transport, global cache, GitHub normalization, and JSR resolver for vaeljs"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[features]
# Default enables the blocking HTTPS transport (`ureq` over `rustls`). Disabling
# default features leaves zero HTTP/TLS dependencies while preserving offline
# cache reads, URL/GitHub normalization, and offline JSR resolution.
default = ["network"]
network = ["dep:ureq"]
# Test-only scripted transport hook for callers such as `vaeljs-core` tests.
test-support = []

[dependencies]
httpdate.workspace = true
vaeljs-manifest = { version = "0.0.0-alpha.1", path = "../vaeljs-manifest" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile.workspace = true
