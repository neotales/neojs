[package]
name = "neojs-node-builtins"
description = "Engine-neutral, opt-in Node built-in policy and synchronous child_process core for NeoJS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe wrappers for poll, non-blocking pipe I/O, and process-group termination.
# The version is already in the workspace lock graph through `tempfile`.
rustix = { version = "1.1.6", default-features = false, features = ["event", "fs", "process", "std"] }

[dev-dependencies]
tempfile.workspace = true
