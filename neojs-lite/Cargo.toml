[package]
name = "neojs-lite"
description = "Command-line ECMAScript runtime for NeoJS Lite, built on QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "neojs-lite"
path = "src/main.rs"

[dependencies]
# The command opts in to the `neo:crypto` built-in explicitly. The library's
# default build stays empty for embedders.
neojs-lite-core = { version = "0.1.0", path = "../neojs-lite-core", features = ["crypto"] }

[dev-dependencies]
tempfile.workspace = true
