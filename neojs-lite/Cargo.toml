[package]
name = "neojs-lite"
description = "Command-line ECMAScript runtime for NeoJS Lite, built on QuickJS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "neojs-lite"
path = "src/main.rs"

[dependencies]
# The command's module bundle is explicit rather than inherited from
# `neojs-lite-core` defaults, so a change to the library defaults cannot
# silently change what the command advertises. This is not a sandbox.
neojs-lite-core = { version = "0.1.0", path = "../neojs-lite-core", default-features = false, features = [
    "manifest",
    "neo-assert",
    "neo-chars",
    "neo-os",
    "neo-strings",
    "neo-test",
    "neo-uuid",
] }
neojs-manifest.workspace = true
# Deterministic shell-style expansion for `neojs-lite test`.
neojs-module-policy = { version = "0.1.0", path = "../neojs-module-policy", features = ["test-glob"] }

[dev-dependencies]
tempfile.workspace = true
