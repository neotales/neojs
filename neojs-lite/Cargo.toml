[package]
name = "neojs-lite"
description = "Command-line ECMAScript runtime for NeoJS Lite, built on QuickJS"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"

[[bin]]
name = "neojs-lite"
path = "src/main.rs"

[features]
default = ["neo-template", "node-compat"]
# Enables `neo:template` in `neojs-lite-core`. Opt-outable with `--no-default-features`.
neo-template = ["neojs-lite-core/neo-template"]
# Enables `node:*` compatibility modules in `neojs-lite-core`. Opt-outable with `--no-default-features`.
node-compat = ["neojs-lite-core/node-compat"]

[dependencies]
# The command's module bundle is explicit rather than inherited from
# `neojs-lite-core` defaults, so a change to the library defaults cannot
# silently change what the command advertises. This is not a sandbox.
neojs-lite-core = { version = "0.0.0-alpha.0", path = "../neojs-lite-core", default-features = false, features = [
    "manifest",
    "neo-assert",
    "neo-chars",
    "neo-console",
    "neo-crypto",
    "neo-fs",
    "neo-os",
    "neo-path",
    "neo-slices",
    "neo-ssh",
    "neo-strings",
    "neo-test",
    "neo-uuid",
    "typescript",
] }
neojs-dts.workspace = true
neojs-manifest.workspace = true
# Deterministic shell-style expansion for `neojs-lite test`.
neojs-module-policy = { version = "0.0.0-alpha.0", path = "../neojs-module-policy", features = ["test-glob"] }

[dev-dependencies]
tempfile.workspace = true
