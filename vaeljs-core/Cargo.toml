[package]
name = "vaeljs-core"
description = "Embeddable ECMAScript module runtime built on Deno's V8 bindings, with erasable TypeScript"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
# A default V8 build keeps the existing surface: the native `vael:chars` and
# `vael:strings` bindings and `vael:slices`, which depends on `chars`.
# `vael-slices` implies `vael-chars` because `CharSlice` captures
# `chars.toUpper`/`chars.toLower`. With default features off, every public
# module, the native registration, the registry entries, and the loader entries
# are absent. The `slices` implementation is a separate file included only
# under `vael-slices`, so it is not embedded in a disabled binary. Features are
# additive and unify across the dependency graph; this is surface selection,
# not a sandbox.
default = ["vael-chars", "vael-db", "vael-exec", "vael-fetch", "vael-http", "vael-slices", "vael-strings", "vael-template", "node-compat", "npm"]
# The native `chars` binding and its canonical V8 registration. This enables
# the shared `chars` module in `vaeljs-builtins`.
vael-chars = ["vaeljs-builtins/chars"]
# The `vael:db` built-in module backed by `vaeljs-dbapi` (SQLite by default).
vael-db = ["dep:vaeljs-dbapi", "dep:serde_json"]
# The `vael:exec` argv-only process execution, PATH lookup, and advisory file
# locking module backed by `vaeljs-exec-core`.
vael-exec = ["dep:vaeljs-exec-core"]
# The `vael:fetch` SSRF-guarded HTTP fetch and atomic streaming download module
# backed by `vaeljs-fetch-core`.
vael-fetch = ["dep:vaeljs-fetch-core", "dep:serde_json"]
# The `vael:http` HTTP/1.1 server, router, static file, and cookie surface
# backed by `vaeljs-http-core`, `hyper`, and `tokio`.
vael-http = ["dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:vaeljs-http-core"]
# `slices` and its loader/registry entries. It cannot be built without `chars`:
# `CharSlice` captures `chars.toUpper` and `chars.toLower`.
vael-slices = ["vael-chars", "vaeljs-builtins/slices"]
# The native `strings` binding and its canonical V8 registration. This enables
# the shared `strings` module in `vaeljs-builtins`.
vael-strings = ["vaeljs-builtins/strings"]
# The `vael:template` Go text/template + Sprig module backed by
# `vaeljs-template-core`. Opt-outable with `--no-default-features`.
vael-template = ["dep:vaeljs-template-core", "dep:serde_json"]
# Node.js compatibility modules (`node:path`, `node:os`, `node:process`,
# `node:fs`, `node:fs/promises`, `node:child_process`, `node:buffer`, `node:url`,
# `node:crypto`). Enabled by default; opt-outable at compile time via
# `--no-default-features` and at runtime via `RuntimeOptions::with_node_compat(false)`.
node-compat = ["dep:vaeljs-node-core", "dep:serde"]
# Opt-outable `npm:` and `package.json` CAS-backed module resolution.
npm = ["dep:vaeljs-npm"]
# Test-only fault injection for the peer-close reply branch. Never enabled by a
# normal build; `vaeljs` enables it only for its own dev/test targets.
test-support = ["vaeljs-crypto-core/test-support", "vaeljs-remote/test-support", "vaeljs-ssh-core/test-support"]

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
getrandom.workspace = true
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
vaeljs-builtins = { workspace = true, features = ["assert", "console", "os", "path", "test", "uuid"] }
vaeljs-crypto-core.workspace = true
vaeljs-dbapi = { workspace = true, optional = true }
vaeljs-exec-core = { workspace = true, optional = true }
vaeljs-fetch-core = { workspace = true, optional = true }
vaeljs-fs-core.workspace = true
vaeljs-http-core = { workspace = true, optional = true }
vaeljs-manifest.workspace = true
vaeljs-module-policy = { version = "0.0.0-alpha.1", path = "../vaeljs-module-policy", features = ["typescript"] }
vaeljs-node-core = { workspace = true, optional = true }
vaeljs-npm = { workspace = true, optional = true }
vaeljs-remote.workspace = true
vaeljs-ssh-core.workspace = true
vaeljs-template-core = { workspace = true, optional = true }
neotales-age.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
base64.workspace = true
# Enables the vendored deno_core test-only seam for the lazy-ESM collision
# test. Normal builds do not enable this feature.
deno_core = { workspace = true, features = ["native_module_testing"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
flate2.workspace = true
vaeljs-dts.workspace = true
neotales-ssh.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
