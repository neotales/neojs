[workspace]
resolver = "3"
members = [
    "neojs-builtins",
    "neojs-core",
    "neojs",
    "neojs-dbapi",
    "neojs-manifest",
    "neojs-module-policy",
    "neojs-lite-core",
    "neojs-lite",
]
# The V8 runtime is the default build. QuickJS crates are opt-in with `-p`, so
# `cargo build`, `cargo test`, and `cargo clippy` without a package selection do
# not compile QuickJS or put `rquickjs` in the default dependency graph.
# `neojs-builtins` is engine-neutral and has no engine dependency; it is part of
# the default test and lint set.
default-members = [
    "neojs-builtins",
    "neojs-core",
    "neojs",
    "neojs-dbapi",
    "neojs-manifest",
    "neojs-module-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/neotales/neojs"
# Verified with rustc 1.100.0. The `neotales-age` dependency requires 1.100.
# Dependencies can raise this floor; lower it only after a successful build
# with the lower toolchain.
rust-version = "1.100.0"
authors = ["NeoTales", "x0craft"]

[workspace.dependencies]
aes = { version = "0.9.4", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
# CBC mode for the `createEncryptor`/`createDecryptor` surface. The crate is
# already present in the graph through `neotales-age`; this direct dependency
# reuses the reviewed 0.2.1 version. `block-padding` supplies PKCS#7 and the
# no-padding check. It is a RustCrypto crate, MIT OR Apache-2.0.
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
# Password hashing. `bcrypt` supplies the bcrypt primitive, modular-crypt
# parsing/formatting, and constant-time verification. `pbkdf2` is already in
# the graph through `neotales-age`; the SHA-2 feature reuses this workspace's
# reviewed `sha2` version.
bcrypt = { version = "0.19.3" }
deno_ast = { version = "0.53.3", default-features = false, features = ["type_strip"] }
deno_core = "0.413.0"
deno_error = "0.7"
# Engine-neutral Neo built-in source and metadata. Shared by the V8 and QuickJS
# runtimes; it has no engine dependency. Each dependent selects modules through
# its features.
neojs-builtins = { version = "0.1.0", path = "neojs-builtins" }
# Shell-style test-file expansion for `neojs test`. The crate is already in the
# graph through `deno_ast`; this pins the reviewed 0.3.4 version.
glob = "0.3.4"
getrandom = "0.4"
# HTTP date parsing for cache freshness and `Age` handling. Small, MIT/Apache-2.0.
httpdate = "1"
# SHA-2 and HMAC are the RustCrypto crates already linked transitively by the
# neotales age and SSH backends. The `neo:crypto` hash surface uses the same
# reviewed versions directly.
hmac = { version = "0.13.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["sha2"] }
# JSR resolver groundwork: SemVer requirement matching and registry JSON. All
# three crates are MIT OR Apache-2.0 and are already in the lock graph through
# other dependencies; this makes the reviewed versions direct dependencies.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
# Best-effort clearing of password and salt copies made by the password
# hashing module. It is not a complete zeroization guarantee; see the module
# documentation.
zeroize = "1.9.0"
# Pinned to the reviewed alpha. The age v1 wire format is stable; the Rust API
# is not, so a version bump is a deliberate review, not an automatic update.
neotales-age = "=0.0.0-alpha.1"
# Pinned for the same reason: SSH wire formats are stable, but this crate is an
# alpha and its Rust API can change. It declares rust-version 1.100, the same
# floor as this workspace.
neotales-ssh = "=0.0.0-alpha.1"
# Driver-neutral contract and the SQLite provider, published from neotales/rs-db.
# Both are alpha releases of the same version, so they are pinned exactly.
neotales-dbapi = "=0.0.0-alpha.0"
neotales-dbapi-sqlite = "=0.0.0-alpha.0"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
tempfile = "3"
# RFC 9562 UUID layout, version/variant bit setting, and canonical formatting.
# The crate's own `new_v4` and `now_v7` helpers panic when the operating system
# CSPRNG fails, so `neo:uuid` feeds its own fallible `getrandom` bytes to
# `uuid::Builder` instead and never takes that path. The `v4` and `v7` features
# are therefore deliberately not enabled. This is the version already present
# in the lockfile through `deno_ast`, so adding it does not pull a second major.
uuid = { version = "1.26.1", default-features = false, features = ["std"] }
# HTTPS module loading. `ureq` is a blocking client over `rustls`; only the
# `tls` feature is enabled, so it uses the bundled `webpki-roots` store and no
# native certificate store, decompression, cookie jar, or environment proxy.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"
