[workspace]
resolver = "3"
members = [
    "vaeljs-builtins",
    "vaeljs-core",
    "vaeljs-crypto-core",
    "vaeljs",
    "vaeljs-dbapi",
    "vaeljs-dts",
    "vaeljs-fs-core",
    "vaeljs-http-core",
    "vaeljs-manifest",
    "vaeljs-module-policy",
    "vaeljs-node-core",
    "vaeljs-remote",
    "vaeljs-npm",
    "vaeljs-ssh-core",
    "vaeljs-template-core",
    "vaeljs-lite-core",
    "vaeljs-lite",
]
# The vendored crates are path dependencies and standalone packages; they must not
# inherit this workspace's manifest or lint configuration.
exclude = ["vendor/deno_core", "vendor/neotales-dbapi"]
# The V8 runtime is the default build. QuickJS crates are opt-in with `-p`, so
# `cargo build`, `cargo test`, and `cargo clippy` without a package selection do
# not compile QuickJS or put `rquickjs` in the default dependency graph.
# `vaeljs-builtins` is engine-neutral and has no engine dependency; it is part of
# the default test and lint set.
default-members = [
    "vaeljs-builtins",
    "vaeljs-core",
    "vaeljs-crypto-core",
    "vaeljs",
    "vaeljs-dbapi",
    "vaeljs-dts",
    "vaeljs-fs-core",
    "vaeljs-http-core",
    "vaeljs-manifest",
    "vaeljs-module-policy",
    "vaeljs-node-core",
    "vaeljs-remote",
    "vaeljs-npm",
    "vaeljs-ssh-core",
    "vaeljs-template-core",
]

[workspace.package]
version = "0.0.0-alpha.0"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/neotales/vaeljs"
# Verified with rustc 1.100.0. The `neotales-age` dependency requires 1.100.
# Dependencies can raise this floor; lower it only after a successful build
# with the lower toolchain.
rust-version = "1.100.0"
authors = ["NeoTales", "x0craft"]

# A pinned copy of `deno_core` 0.413.0 with one added public seam:
# `JsRuntime::register_native_module`, which lets the V8 runtime register an
# eager synthetic module with explicit named exports instead of serving an
# ECMAScript facade. The exact revision, checksum, and diff are documented in
# `vendor/deno_core/PATCH.md`. Remove both this section and the directory when
# an upstream release exposes the same seam.
[patch.crates-io]
deno_core = { path = "vendor/deno_core" }
# Pinned copy of `neotales-dbapi` 0.0.0-alpha.0 with `Row::columns` and
# `Row::column_name` exposed so `vael:db` can materialize JS row objects.
# Documented in `vendor/neotales-dbapi/PATCH.md`.
neotales-dbapi = { path = "vendor/neotales-dbapi" }

[workspace.dependencies]
aes = { version = "0.9.4", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
# CBC mode for the `createEncryptor`/`createDecryptor` surface. The crate is
# already present in the graph through `neotales-age`; this direct dependency
# reuses the reviewed 0.2.1 version. `block-padding` supplies PKCS#7 and the
# no-padding check. It is a RustCrypto crate, MIT OR Apache-2.0.
cbc = { version = "0.2.1", default-features = false, features = ["block-padding"] }
# Password hashing. `bcrypt` supplies the bcrypt primitive, modular-crypt
# parsing/formatting, and constant-time verification. `pbkdf2` is already in
# the graph through `neotales-age`; the SHA-2 feature reuses this workspace's
# reviewed `sha2` version.
bcrypt = { version = "0.19.3" }
deno_ast = { version = "0.53.3", default-features = false, features = ["type_strip"] }
deno_core = "0.413.0"
deno_error = "0.7"
# Engine-neutral Vael built-in source and metadata. Shared by the V8 and QuickJS
# runtimes; it has no engine dependency. Each dependent selects modules through
# its features.
vaeljs-builtins = { version = "0.0.0-alpha.0", path = "vaeljs-builtins" }
# Engine-neutral synchronous cryptographic core for `vael:crypto`. Has no JS
# engine or Tokio dependency.
vaeljs-crypto-core = { version = "0.0.0-alpha.0", path = "vaeljs-crypto-core" }
# Engine-neutral TypeScript declaration (.d.ts) bundles for V8 and QuickJS.
vaeljs-dts = { version = "0.0.0-alpha.0", path = "vaeljs-dts" }
# Driver-neutral SQL API with strict JSON configuration and SQLite provider.
vaeljs-dbapi = { version = "0.0.0-alpha.0", path = "vaeljs-dbapi" }
# Engine-neutral core filesystem operations for `vael:fs`.
vaeljs-fs-core = { version = "0.0.0-alpha.0", path = "vaeljs-fs-core" }
# Engine-neutral core HTTP primitives for `vael:http`.
vaeljs-http-core = { version = "0.0.0-alpha.0", path = "vaeljs-http-core" }
# `vael.jsonc` JSONC parsing, bounded upward discovery, workspace expansion, and
# pure import-map/workspace resolution.
vaeljs-manifest = { version = "0.0.0-alpha.0", path = "vaeljs-manifest" }
# Engine-neutral shared Rust backend for `node:*` built-in modules.
vaeljs-node-core = { version = "0.0.0-alpha.0", path = "vaeljs-node-core" }
# Engine-neutral npm specifier, SemVer, package.json, exports, CAS tarball, lockfile,
# and virtual graph resolver.
vaeljs-npm = { version = "0.0.0-alpha.0", path = "vaeljs-npm" }
# Engine-neutral HTTPS transport, global cache, GitHub normalization, and JSR
# resolution. Has no JS engine dependency; `network` enables `ureq` + `rustls`.
vaeljs-remote = { version = "0.0.0-alpha.0", path = "vaeljs-remote" }
# Engine-neutral synchronous SSH core for `vael:ssh`. Has no JS engine or Tokio
# dependency; wraps `neotales-ssh` with mandatory host trust and bounded execution.
vaeljs-ssh-core = { version = "0.0.0-alpha.0", path = "vaeljs-ssh-core" }
# Engine-neutral Go text/template and Sprig core for `vael:template`. Has no JS
# engine or Tokio dependency.
vaeljs-template-core = { version = "0.0.0-alpha.0", path = "vaeljs-template-core" }
base64 = "0.22.1"
flate2 = "1.1.11"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
# Shell-style test-file expansion for `vjs test`. The crate is already in the
# graph through `deno_ast`; this pins the reviewed 0.3.4 version.
glob = "0.3.4"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
# HTTP date parsing for cache freshness and `Age` handling. Small, MIT/Apache-2.0.
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
# SHA-2 and HMAC are the RustCrypto crates already linked transitively by the
# neotales age and SSH backends. The `vael:crypto` hash surface uses the same
# reviewed versions directly.
hmac = { version = "0.13.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["sha2"] }
# JSR resolver groundwork: SemVer requirement matching and registry JSON. All
# three crates are MIT OR Apache-2.0 and are already in the lock graph through
# other dependencies; this makes the reviewed versions direct dependencies.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false, features = ["alloc"] }
# Best-effort clearing of password and salt copies made by the password
# hashing module. It is not a complete zeroization guarantee; see the module
# documentation.
zeroize = "1.9.0"
# Pinned to the reviewed alpha. The age v1 wire format is stable; the Rust API
# is not, so a version bump is a deliberate review, not an automatic update.
neotales-age = "=0.0.0-alpha.1"
# Pinned for the same reason: SSH wire formats are stable, but this crate is an
# alpha and its Rust API can change. It declares rust-version 1.100, the same
# floor as this workspace.
neotales-ssh = "=0.0.0-alpha.1"
# Driver-neutral contract and the SQLite provider, published from neotales/rs-db.
# Both are alpha releases of the same version, so they are pinned exactly.
neotales-dbapi = "=0.0.0-alpha.0"
neotales-dbapi-sqlite = "=0.0.0-alpha.0"
# Pure Go text/template engine and deterministic Sprig helper library. Both are
# alpha releases with unstable Rust APIs, so they are pinned exactly.
neotales-gotmpl = "=0.0.0-alpha.1"
neotales-sprig = "=0.0.0-alpha.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "sync", "signal"] }
tempfile = "3"
# RFC 9562 UUID layout, version/variant bit setting, and canonical formatting.
# The crate's own `new_v4` and `now_v7` helpers panic when the operating system
# CSPRNG fails, so `vael:uuid` feeds its own fallible `getrandom` bytes to
# `uuid::Builder` instead and never takes that path. The `v4` and `v7` features
# are therefore deliberately not enabled. This is the version already present
# in the lockfile through `deno_ast`, so adding it does not pull a second major.
uuid = { version = "1.26.1", default-features = false, features = ["std"] }
# HTTPS module loading. `ureq` is a blocking client over `rustls`; only the
# `tls` feature is enabled, so it uses the bundled `webpki-roots` store and no
# native certificate store, decompression, cookie jar, or environment proxy.
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"
# Unicode General_Category lookup for `vaeljs-builtins::chars`. The crate ships
# the Unicode 16.0 tables, is `no_std`, and has no dependencies of its own.
unicode-general-category = "1.1.0"

# Strip symbol tables from shipped release binaries (`vjs` and `vjs-lite`) across
# all 6 release targets while preserving unwind tables for clean panics.
[profile.release]
strip = "symbols"
