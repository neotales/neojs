# Supply-chain, advisory, license, crate-ban, and source policy for vaeljs.
# Requires cargo-deny >= 0.19 (v2 config schema and `-A unmatched-skip` support;
# CI pins `cargo-deny@0.22.1`).
# Checked in CI across both the V8 workspace and `vaeljs-lite` (`cargo deny`).

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true
exclude-dev = false

[advisories]
# In cargo-deny 0.16+ (v2), vulnerability, unsound, and notice advisories are
# denied by default unless explicitly listed in `ignore`.
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "warn"
ignore = [
  # Add time-bounded RUSTSEC-* exceptions only with justification, expiry, and tracking issue.
]

[licenses]
# Verified against Cargo.lock (including `smartstring` MPL-2.0+ via deno_ast/swc,
# `cooked-waker` MPL-2.0 via deno_core, `icu_*` Unicode-3.0, `webpki-roots` CDLA-Permissive-2.0,
# `foldhash`/`zlib-rs` Zlib, and `ed25519-dalek`/`curve25519-dalek` BSD-3-Clause).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "MPL-2.0+",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Keep cross-graph checks (`vaeljs` V8 vs `vaeljs-lite` QuickJS) quiet when an
# allowlisted license only appears in one runtime graph.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# Block undesirable C/TLS/archive/SSH stacks so pure-Rust & bounded parsers stay intact.
deny = [
  { name = "openssl", wrappers = [] },
  { name = "openssl-sys", wrappers = [] },
  { name = "native-tls", wrappers = [] },
  # vaeljs-npm uses a custom zero-unsafe bounded gzip/tar parser.
  { name = "tar", wrappers = [] },
  # vaeljs-ssh-core uses pure-Rust neotales-ssh.
  { name = "ssh2", wrappers = [] },
]

# Explicit baseline skips for existing multi-version splits in Cargo.lock.
# Prune each entry as upstream dependencies unify (RustCrypto 0.11, getrandom 0.4, etc.).
skip = [
  # RustCrypto 0.10 vs 0.11 split between aes-gcm 0.10.3 / neotales-* and workspace aes/sha2/hmac:
  { name = "aead", version = "0.5.2" },
  { name = "aes", version = "0.8.4" },
  { name = "aes-gcm", version = "0.10.3" },
  { name = "block-buffer", version = "0.10.4" },
  { name = "cipher", version = "0.4.4" },
  { name = "crypto-common", version = "0.1.7" },
  { name = "ctr", version = "0.9.2" },
  { name = "digest", version = "0.10.7" },
  { name = "ghash", version = "0.5.1" },
  { name = "polyval", version = "0.6.2" },
  { name = "sha1", version = "0.10.7" },
  { name = "sha2", version = "0.10.9" },
  { name = "universal-hash", version = "0.5.1" },

  # RNG & encoding splits across deno_core / sqlx / ureq:
  { name = "base64", version = "0.22.1" },
  { name = "getrandom", version = "0.2.17" },
  { name = "getrandom", version = "0.3.4" },
  { name = "rand", version = "0.8.8" },
  { name = "rand_chacha", version = "0.3.1" },
  { name = "rand_core", version = "0.6.4" },
  { name = "miniz_oxide", version = "0.8.9" },

  # PKI / TLS / platform splits:
  { name = "const-oid", version = "0.9.6" },
  { name = "der", version = "0.7.10" },
  { name = "pem-rfc7468", version = "0.7.0" },
  { name = "pkcs1", version = "0.7.5" },
  { name = "pkcs8", version = "0.10.2" },
  { name = "spki", version = "0.7.3" },
  { name = "signature", version = "2.2.0" },
  { name = "webpki-roots", version = "0.26.11" },
  { name = "windows-sys", version = "0.52.0" },
  { name = "windows-sys", version = "0.59.0" },
  { name = "linux-raw-sys", version = "0.4.15" },
  { name = "rustix", version = "0.38.44" },

  # Hashing / utility / proc-macro splits:
  { name = "hashbrown", version = "0.14.5" },
  { name = "hashbrown", version = "0.16.1" },
  { name = "bindgen", version = "0.70.1" },
  { name = "bit-vec", version = "0.8.0" },
  { name = "cpufeatures", version = "0.2.17" },
  { name = "inout", version = "0.1.4" },
  { name = "r-efi", version = "5.3.0" },
  { name = "rustc-hash", version = "1.1.0" },
  { name = "shlex", version = "1.3.0" },
  { name = "siphasher", version = "0.3.11" },
  { name = "syn", version = "2.0.119" },
  { name = "synstructure", version = "0.13.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
